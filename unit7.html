<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课堂单词对对碰 </title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'PingFang SC', sans-serif; }
    body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; color: #fff; }
    header { text-align: center; margin-bottom: 12px; }
    h1 { font-size: 2rem; color: #00cec9; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    p.subtitle { font-size: 0.85rem; color: #dfe6e9; margin-top: 4px; }
    .controls { background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); padding: 12px 18px; border-radius: 14px; width: 100%; max-width: 800px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.15); }
    .stats { display: flex; gap: 15px; font-size: 1rem; font-weight: bold; color: #ffeaa7; }
    .btn { background: #00b894; color: #fff; border: none; padding: 8px 16px; font-size: 0.9rem; font-weight: bold; border-radius: 20px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #55efc4; color: #2d3436; transform: translateY(-2px); }
    .btn-edit { background: #0984e3; }
    /* 4x4 排版 */
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; max-width: 800px; perspective: 1000px; }
    .card { background: #2d3436; border: 2.5px solid #00cec9; border-radius: 12px; height: 100px; display: flex; justify-content: center; align-items: center; cursor: pointer; text-align: center; position: relative; transition: transform 0.5s; transform-style: preserve-3d; box-shadow: 0 6px 12px rgba(0,0,0,0.3); }
    .card.flipped { transform: rotateY(180deg); cursor: default; }
    .card.matched { opacity: 0; visibility: hidden; transition: opacity 0.5s, visibility 0.5s; }
    .card-number { position: absolute; top: 4px; left: 8px; background: #00cec9; color: #2d3436; font-size: 0.8rem; font-weight: 900; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2; }
    .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; padding: 8px; display: flex; justify-content: center; align-items: center; }
    .card-front { background: linear-gradient(145deg, #34495e, #2c3e50); color: #ecf0f1; font-size: 1.5rem; font-weight: bold; }
    .card-back { background: #ffffff; color: #2d3436; transform: rotateY(180deg); font-size: 1.05rem; font-weight: bold; word-break: break-word; }
    /* 弹窗 */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: #2d3436; padding: 20px; border-radius: 14px; width: 90%; max-width: 500px; color: white; }
    textarea { width: 100%; height: 150px; margin: 10px 0; padding: 10px; border-radius: 8px; border: 1px solid #00cec9; background: #636e72; color: #fff; font-size: 0.95rem; }
  </style>
</head>
<body>
  <header>
    <h1>✨ 单词对对碰 (Memory Match)</h1>
    <p class="subtitle">配对英文与中文！(看哪个小组翻牌步数最少)</p>
  </header>
  <div class="controls">
    <div class="stats">
      <div>翻牌次数: <span id="flips">0</span></div>
      <div>已配对: <span id="matches">0</span> / 8</div>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-edit" onclick="openModal()">✏️ 自定义 8 组单词</button>
      <button class="btn" onclick="initGame()"> 重新洗牌</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="modal" id="modal">
    <div class="modal-content">
      <h3>✏️ 自定义 8 组配对（每行格式：英文=中文）</h3>
      <textarea id="pairInput"></textarea>
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button class="btn" onclick="savePairs()">保存并重置</button>
        <button class="btn" style="background:#b2bec3" onclick="closeModal()">取消</button>
      </div>
    </div>
  </div>
  <script>
    let defaultPairs = [
      { en: "make the bed", cn: "整理床铺" },
      { en: " wash the vegetables", cn: "洗蔬菜" },
      { en: "cook a meal", cn: "做饭" },
      { en: "sweep the floor", cn: "扫地" },
      { en: "clean the windows", cn: "擦窗户" },
      { en: "water the plants", cn: "给植物浇水" },
      { en: "iron", cn: "熨烫" },
      { en: "helpful", cn: "有帮助的" }
    ];
    let pairs = [...defaultPairs];
    let cardsData = [];
    let flippedCards = [];
    let lockBoard = false;
    let flipCount = 0;
    let matchCount = 0;
    function initGame() {
      flipCount = 0; matchCount = 0; flippedCards = []; lockBoard = false;
      document.getElementById('flips').innerText = flipCount;
      document.getElementById('matches').innerText = matchCount;
      // 生成 16 张卡片 (8个英文 + 8个中文)
      cardsData = [];
      pairs.forEach((pair, id) => {
        cardsData.push({ id, text: pair.en });
        cardsData.push({ id, text: pair.cn });
      });
      cardsData.sort(() => Math.random() - 0.5);
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      cardsData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.id = item.id;
        card.innerHTML = `
          <div class="card-number">${index + 1}</div>
          <div class="card-front">❓</div>
          <div class="card-back">${item.text}</div>
        `;
        card.onclick = () => flipCard(card);
        grid.appendChild(card);
      });
    }
    function flipCard(card) {
      if (lockBoard || card.classList.contains('flipped') || flippedCards.includes(card)) return;
      card.classList.add('flipped');
      flippedCards.push(card);
      if (flippedCards.length === 2) {
        flipCount++;
        document.getElementById('flips').innerText = flipCount;
        checkMatch();
      }
    }
    function checkMatch() {
      lockBoard = true;
      const [c1, c2] = flippedCards;
      if (c1.dataset.id === c2.dataset.id) {
        // 匹配成功
        setTimeout(() => {
          c1.classList.add('matched');
          c2.classList.add('matched');
          matchCount++;
          document.getElementById('matches').innerText = matchCount;
          flippedCards = [];
          lockBoard = false;
          if (matchCount === 8) {
            alert(` 太棒了！全盘消除成功！一共使用了 ${flipCount} 次翻牌！`);
          }
        }, 600);
      } else {
        // 匹配失败，翻回
        setTimeout(() => {
          c1.classList.remove('flipped');
          c2.classList.remove('flipped');
          flippedCards = [];
          lockBoard = false;
        }, 1000);
      }
    }
    function openModal() {
      const text = pairs.map(p => `${p.en}=${p.cn}`).join('\n');
      document.getElementById('pairInput').value = text;
      document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
    function savePairs() {
      const lines = document.getElementById('pairInput').value.split('\n').filter(l => l.includes('='));
      if (lines.length < 8) {
        alert("请输入至少 8 组配对哦！（格式：英文=中文）");
        return;
      }
      pairs = lines.slice(0, 8).map(l => {
        const [en, cn] = l.split('=');
        return { en: en.trim(), cn: cn.trim() };
      });
      closeModal();
      initGame();
    }
    initGame();
  </script>
</body>
</html>
